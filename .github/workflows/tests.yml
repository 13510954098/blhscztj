name: Tests
on:
  pull_request:
  push:
    paths:
      - '**.py'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  native-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/install_tools.py
      - name: Local-only native HTTP proxy smoke tests (no public node probing)
        env:
          RUN_NATIVE_TESTS: '1'
        run: python -m unittest discover -s tests -p test_native.py -v
