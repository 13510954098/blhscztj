name: TEMP handoff cleanup

# 临时工作流：handoff 第四节里，本地会话的 GitHub 令牌没有 actions=write 权限，
# 这里改用本次运行的 GITHUB_TOKEN（actions: write）完成：
#   - 停用 TEMP fetch gofile
#   - 删除第四节点名的历史运行记录（逐条复核名称且必须已结束）
#   - artifacts 只保留最近 2 个（update.yml 有运行未结束时跳过）
#   - 最后停用本工作流自身
# 复用 tmp-fetch-handoff.yml 的路径，不额外新增工作流条目。用完即删本文件。

on:
  push:
    branches:
      - arena/a1d23447-blhscztj
    paths:
      - .github/workflows/tmp-fetch-handoff.yml

permissions:
  actions: write

concurrency:
  group: tmp-handoff-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 停用 TEMP fetch gofile
        continue-on-error: true
        run: gh api -X PUT "repos/$GH_REPO/actions/workflows/380956165/disable" && echo "disabled workflow 380956165"

      - name: 删除指定的已结束运行记录（逐条复核）
        continue-on-error: true
        run: |
          set -uo pipefail
          while read -r id expected; do
            [ -n "$id" ] || continue
            info=$(gh api "repos/$GH_REPO/actions/runs/$id" --jq '"\(.status)|\(.name)"' 2>/dev/null) || { echo "skip $id (not found)"; continue; }
            status=${info%%|*}; name=${info#*|}
            if [ "$status" != "completed" ] || [ "$name" != "$expected" ]; then
              echo "::warning::skip $id: status=$status name=$name (expected completed / $expected)"
              continue
            fi
            gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" && echo "deleted run $id ($name)"
          done <<'EOF'
          38107224805 TEMP fetch handoff
          38104963029 TEMP fetch gofile
          38104831914 TEMP fetch gofile
          38104720645 TEMP fetch gofile
          38104641632 TEMP fetch gofile
          38104583392 TEMP fetch gofile
          38104524019 TEMP fetch gofile
          38104460588 TEMP fetch gofile
          38104417426 TEMP fetch gofile
          36827176092 Tests
          36827172781 Tests
          37431283281 Update JCNode subscription
          37371904878 Update JCNode subscription
          36832903377 Update JCNode subscription
          36815752192 Update JCNode subscription
          36701647549 Update JCNode subscription
          36303237896 Update JCNode subscription
          36301339554 Update JCNode subscription
          36299616478 Update JCNode subscription
          EOF

      - name: artifacts 只保留最近 2 个
        continue-on-error: true
        run: |
          set -euo pipefail
          busy=$(gh run list --workflow update.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" -gt 0 ]; then
            echo "::warning::update.yml 仍有运行未结束，跳过 artifacts 清理"
            exit 0
          fi
          gh api "repos/$GH_REPO/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | "\(.created_at) \(.id) \(.name)"' | sort -r | tail -n +3 \
            | while read -r created id name; do
                gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" && echo "deleted artifact $id $name ($created)"
              done

      - name: 停用本临时工作流
        if: always()
        run: |
          id=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}" --jq .workflow_id)
          gh api -X PUT "repos/$GH_REPO/actions/workflows/$id/disable" && echo "disabled workflow $id"
