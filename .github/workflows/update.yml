name: Update JCNode subscription

on:
  schedule:
    # 站点一般在北京时间 08:30-10:40 更新，这里 11:58 抓一次，18:00 再补一次
    # 注意：cron 用 UTC，北京时间 = UTC + 8
    - cron: "58 3 * * *"    # 11:58 CST
    - cron: "0 10 * * *"    # 18:00 CST
    # Low-cost catch-up ticks. GitHub cron may be delayed/dropped; gate deduplicates.
    - cron: "17,47 3-15 * * *"
  workflow_dispatch:
    inputs:
      code:
        description: "已知口令（4 位数字），留空则自动枚举 AABB"
        required: false
        default: ""
      full_sweep:
        description: "AABB 失效时全量扫描 0000-9999（约 1 小时，慎用）"
        type: boolean
        default: false
      alive_scope:
        description: "mihomo 实测范围：full=全库（默认，约 10-30 分钟），daily=仅当日节点（快速）"
        type: choice
        options: [full, daily]
        default: full

permissions:
  contents: write

concurrency:
  group: jcnode-update
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      due: ${{ steps.gate.outputs.due }}
      slot: ${{ steps.gate.outputs.slot }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - id: gate
        run: python3 scripts/schedule_gate.py

  update:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装合并依赖
        run: python -m pip install --disable-pip-version-check --no-input PyYAML maxminddb

      - name: 离线测试（不探测外部节点）
        run: python -m unittest discover -s tests -v

      - name: 定位抓取脚本
        id: locate-fetch
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/fetch_jcnode.py ]; then
            echo "path=scripts/fetch_jcnode.py" >> "$GITHUB_OUTPUT"
            echo "✅ 找到 scripts/fetch_jcnode.py"
          elif [ -f fetch_jcnode.py ]; then
            echo "path=fetch_jcnode.py" >> "$GITHUB_OUTPUT"
            echo "✅ 找到根目录 fetch_jcnode.py"
          else
            echo "❌ 仓库里没有 fetch_jcnode.py"
            exit 1
          fi

      - name: 定位合并脚本
        id: locate-merge
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/merge_subscriptions.py ]; then
            echo "path=scripts/merge_subscriptions.py" >> "$GITHUB_OUTPUT"
            echo "✅ 找到 scripts/merge_subscriptions.py"
          elif [ -f merge_subscriptions.py ]; then
            echo "path=merge_subscriptions.py" >> "$GITHUB_OUTPUT"
            echo "✅ 找到根目录 merge_subscriptions.py"
          else
            echo "❌ 仓库里没有 merge_subscriptions.py"
            exit 1
          fi

      - name: 抓取到临时目录（不碰旧订阅）
        env:
          INPUT_CODE: ${{ inputs.code }}
          INPUT_FULL: ${{ inputs.full_sweep }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .incoming-sub
          mkdir -p .incoming-sub
          # 让抓取脚本继续优先尝试上次口令；本次 meta 会在抓取后覆盖
          if [ -f sub/meta.json ]; then cp sub/meta.json .incoming-sub/meta.json; fi
          SCRIPT="${{ steps.locate-fetch.outputs.path }}"
          ARGS=""
          if [ -n "${INPUT_CODE:-}" ]; then ARGS="$ARGS --code ${INPUT_CODE}"; fi
          if [ "${INPUT_FULL:-false}" = "true" ]; then ARGS="$ARGS --mode full"; fi
          echo "运行: python $SCRIPT --out-dir .incoming-sub ${ARGS:-（默认 AABB 枚举）}"
          python "$SCRIPT" --out-dir .incoming-sub --history .incoming-sub/codes.log $ARGS

      - name: 自动修复每日 Clash 常见格式并校正元数据
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import hashlib
          import json
          from pathlib import Path
          import re
          import unicodedata
          import yaml

          class QuotedShortId(str):
              pass

          class ClashDumper(yaml.SafeDumper):
              pass

          def represent_short_id(dumper, value):
              return dumper.represent_scalar("tag:yaml.org,2002:str", str(value), style='"')

          ClashDumper.add_representer(QuotedShortId, represent_short_id)
          short_ids_quoted = [0]

          def quote_short_ids(value):
              if isinstance(value, dict):
                  for key, item in list(value.items()):
                      if key in ("short-id", "short_id") and isinstance(item, str):
                          value[key] = QuotedShortId(item)
                          short_ids_quoted[0] += 1
                      else:
                          quote_short_ids(item)
              elif isinstance(value, list):
                  for item in value:
                      quote_short_ids(item)

          clash = Path(".incoming-sub/clash.yaml")
          meta_path = Path(".incoming-sub/meta.json")
          raw = clash.read_bytes()
          source_text = raw.decode("utf-8")
          source_text = re.sub(
              r"(?m)^([ \t]*short-id[ \t]*:[ \t]*)(?![\"'])([0-9A-Fa-f]+)([ \t]*(?:#.*)?)$",
              lambda match: match.group(1) + '\"' + match.group(2) + '\"' + match.group(3),
              source_text,
          )
          doc = yaml.safe_load(source_text)
          if not isinstance(doc, dict):
              raise ValueError("Clash YAML 根节点不是映射，无法安全自动修复")

          repairs = []
          original = copy.deepcopy(doc)
          path_controls_encoded = [0]

          def encode_url_path(value):
              if isinstance(value, str):
                  result = []
                  for char in value:
                      if unicodedata.category(char) == "Cc" and char not in "\\t\\r\\n":
                          result.extend(f"%{byte:02X}" for byte in char.encode("utf-8"))
                          path_controls_encoded[0] += 1
                      else:
                          result.append(char)
                  return "".join(result)
              if isinstance(value, list):
                  return [encode_url_path(item) for item in value]
              return value

          proxies = doc.get("proxies")
          if isinstance(proxies, dict):
              proxies = [proxies]
              repairs.append("proxies 单项映射已包装为列表")
          elif proxies is None:
              proxies = []
          elif not isinstance(proxies, list):
              proxies = []
              repairs.append("无效 proxies 已替换为空列表")

          valid_proxies = []
          for index, proxy in enumerate(proxies):
              if not isinstance(proxy, dict):
                  repairs.append(f"proxies[{index}] 不是映射，已移除")
                  continue
              for option_name in ("ws-opts", "http-opts"):
                  path_options = proxy.get(option_name)
                  if isinstance(path_options, dict) and "path" in path_options:
                      path_options["path"] = encode_url_path(path_options["path"])
              opts = proxy.get("http-opts")
              if "http-opts" in proxy and not isinstance(opts, dict):
                  proxy.pop("http-opts", None)
                  repairs.append(f"proxies[{index}].http-opts 结构无效，已移除")
                  opts = None
              if isinstance(opts, dict) and "headers" in opts:
                  headers = opts["headers"]
                  if headers is None or not isinstance(headers, dict):
                      opts["headers"] = {}
                      repairs.append(f"proxies[{index}].http-opts.headers 已修复为空映射")
                  else:
                      fixed = {}
                      for key, value in headers.items():
                          if not isinstance(key, (str, int, float, bool)):
                              repairs.append(f"proxies[{index}] 请求头键无法识别，已移除")
                              continue
                          name = str(key)
                          if value is None:
                              repairs.append(f"请求头 {name} 为空，已移除")
                          elif isinstance(value, str):
                              fixed[name] = [value]
                          elif isinstance(value, (int, float, bool)):
                              fixed[name] = [str(value)]
                          elif isinstance(value, list):
                              values = [str(item) for item in value if isinstance(item, (str, int, float, bool))]
                              if any(item is not None and not isinstance(item, (str, int, float, bool)) for item in value):
                                  repairs.append(f"请求头 {name} 含嵌套值，已移除不安全部分")
                              if values or not value:
                                  fixed[name] = values
                              else:
                                  repairs.append(f"请求头 {name} 没有有效值，已移除")
                          else:
                              repairs.append(f"请求头 {name} 不是标量或列表，已移除")
                      opts["headers"] = fixed
              valid_proxies.append(proxy)
          doc["proxies"] = valid_proxies
          quote_short_ids(doc)

          def find_control(value, location="root"):
              if isinstance(value, str):
                  if any(unicodedata.category(ch) == "Cc" and ch not in "\\t\\r\\n" for ch in value):
                      return location
              elif isinstance(value, dict):
                  for key, item in value.items():
                      found = find_control(key, location + ".<key>")
                      if found:
                          return found
                      found = find_control(item, location + ".field")
                      if found:
                          return found
              elif isinstance(value, list):
                  for item_index, item in enumerate(value):
                      found = find_control(item, f"{location}[{item_index}]")
                      if found:
                          return found
              return None

          location = find_control(doc)
          if location:
              raise ValueError(f"每日 Clash 仍含非路径控制字符（{location}），停止发布以避免 FlClash 无法加载")
          changed = original != doc or short_ids_quoted[0] > 0
          output = raw
          if changed:
              output = yaml.dump(doc, Dumper=ClashDumper, allow_unicode=True, sort_keys=False,
                                 default_flow_style=False, width=4096).encode("utf-8")
              clash.write_bytes(output)

          try:
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
          except (json.JSONDecodeError, UnicodeDecodeError):
              meta = {}
              repairs.append("meta.json 无法解析，已重建校验字段")
          if not isinstance(meta, dict):
              meta = {}
              repairs.append("meta.json 根结构无效，已重建")
          for key in ("nodes", "sha256_16", "source_sha256_16"):
              if not isinstance(meta.get(key), dict):
                  meta[key] = {}
                  repairs.append(f"meta.json 的 {key} 已重建")
          meta["nodes"]["clash"] = len(doc.get("proxies") or [])
          meta["source_sha256_16"]["clash"] = hashlib.sha256(raw).hexdigest()[:16]
          meta["sha256_16"]["clash"] = hashlib.sha256(output).hexdigest()[:16]
          meta["clash_normalization"] = {
              "http_opts_headers": "scalar_values_to_lists",
              "flclash_path_controls_percent_encoded": path_controls_encoded[0],
              "reality_short_ids_quoted": short_ids_quoted[0],
              "changed": changed,
          }
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"✅ 每日 Clash 处理完成：{len(doc.get('proxies') or [])} 个节点；元数据已同步")
          for item in repairs:
              print(f"⚠️ 自动修复：{item}")
          PY

      - name: 保存当天订阅（覆盖 daily，保留综合版）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sub
          for file in clash.yaml singbox.json v2ray.txt meta.json; do
            test -s ".incoming-sub/$file"
            cp ".incoming-sub/$file" "sub/$file.tmp"
            mv "sub/$file.tmp" "sub/$file"
          done
          echo "✅ 当天订阅已更新到 sub/ 根目录"

      - name: 合并到综合订阅（当日结构模板，全库按 MB/s 排序）
        shell: bash
        run: |
          set -euo pipefail
          MERGER="${{ steps.locate-merge.outputs.path }}"
          python "$MERGER" \
            --base sub/merged \
            --out sub/merged \
            --incoming .incoming-sub \
            --history history/codes.log
          rm -rf .incoming-sub

      - name: 修复综合 Clash 中 FlClash 不接受的路径控制字符
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import unicodedata
          import yaml

          class QuotedShortId(str):
              pass

          class ClashDumper(yaml.SafeDumper):
              pass

          def represent_short_id(dumper, value):
              return dumper.represent_scalar("tag:yaml.org,2002:str", str(value), style='"')

          ClashDumper.add_representer(QuotedShortId, represent_short_id)
          short_ids_quoted = [0]

          def quote_short_ids(value):
              if isinstance(value, dict):
                  for key, item in list(value.items()):
                      if key in ("short-id", "short_id") and isinstance(item, str):
                          value[key] = QuotedShortId(item)
                          short_ids_quoted[0] += 1
                      else:
                          quote_short_ids(item)
              elif isinstance(value, list):
                  for item in value:
                      quote_short_ids(item)

          path = Path("sub/merged/clash.yaml")
          raw = path.read_bytes()
          source_text = raw.decode("utf-8")
          source_text = re.sub(
              r"(?m)^([ \t]*short-id[ \t]*:[ \t]*)(?![\"'])([0-9A-Fa-f]+)([ \t]*(?:#.*)?)$",
              lambda match: match.group(1) + '\"' + match.group(2) + '\"' + match.group(3),
              source_text,
          )
          doc = yaml.safe_load(source_text)
          if not isinstance(doc, dict) or not isinstance(doc.get("proxies"), list):
              raise ValueError("合并 Clash 的 YAML/proxies 结构无效")
          encoded = [0]

          def encode_url_path(value):
              if isinstance(value, str):
                  result = []
                  for char in value:
                      if unicodedata.category(char) == "Cc" and char not in "\\t\\r\\n":
                          result.extend(f"%{byte:02X}" for byte in char.encode("utf-8"))
                          encoded[0] += 1
                      else:
                          result.append(char)
                  return "".join(result)
              if isinstance(value, list):
                  return [encode_url_path(item) for item in value]
              return value

          for proxy in doc["proxies"]:
              if not isinstance(proxy, dict):
                  continue
              for option_name in ("ws-opts", "http-opts"):
                  options = proxy.get(option_name)
                  if isinstance(options, dict) and "path" in options:
                      options["path"] = encode_url_path(options["path"])

          def find_control(value, location="root"):
              if isinstance(value, str):
                  if any(unicodedata.category(ch) == "Cc" and ch not in "\\t\\r\\n" for ch in value):
                      return location
              elif isinstance(value, dict):
                  for key, item in value.items():
                      found = find_control(key, location + ".<key>")
                      if found:
                          return found
                      found = find_control(item, location + ".field")
                      if found:
                          return found
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      found = find_control(item, f"{location}[{index}]")
                      if found:
                          return found
              return None

          quote_short_ids(doc)
          location = find_control(doc)
          if location:
              raise ValueError(f"Clash 仍含非路径控制字符（{location}），为避免生成 FlClash 无法加载的配置，停止发布")
          output = raw
          if encoded[0] or short_ids_quoted[0]:
              output = yaml.dump(doc, Dumper=ClashDumper, allow_unicode=True, sort_keys=False,
                                 default_flow_style=False, width=4096).encode("utf-8")
              path.write_bytes(output)

          meta_path = Path("sub/merged/meta.json")
          try:
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError, UnicodeDecodeError):
              meta = {}
          if not isinstance(meta, dict):
              meta = {}
          for key in ("nodes", "sha256_16"):
              if not isinstance(meta.get(key), dict):
                  meta[key] = {}
          meta["nodes"]["clash"] = len(doc["proxies"])
          meta["sha256_16"]["clash"] = hashlib.sha256(output).hexdigest()[:16]
          previous = meta.get("clash_normalization")
          if not isinstance(previous, dict):
              previous = {}
          previous["flclash_path_controls_percent_encoded"] = encoded[0]
          previous["reality_short_ids_quoted"] = short_ids_quoted[0]
          meta["clash_normalization"] = previous
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"✅ merged Clash FlClash 路径字符检查通过；本次编码修复 {encoded[0]} 个控制字符")
          PY

      - name: 下载 mihomo 内核（多版本回退 + 下载即体检，临时机每次全新下载）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools

          # 通过 releases/latest 的 302 重定向解析最新版本号（不消耗 API 配额）
          latest="$(curl -fsSL -o /dev/null -w '%{url_effective}' \
            https://github.com/MetaCubeX/mihomo/releases/latest \
            | sed -n 's#.*/tag/##p' | tr -d '[:space:]')"
          if [ -z "${latest}" ] || [ "${latest}" = "latest" ]; then
            echo "⚠️ 未能解析最新版本号，回退固定版本 v1.19.31"
            latest="v1.19.31"
          fi
          echo "mihomo 最新版本：${latest}（本地全库验证过的基准版：v1.19.31）"

          # 下载一个候选内核并做三级体检：1) -v 可执行 2) -t 最小配置可加载
          # 3) 真实启动后 API 能就绪。任一不过即返回失败，由外层尝试下一组合。
          fetch_kernel() {
            local ver="$1" flavor="$2"
            local base="https://github.com/MetaCubeX/mihomo/releases/download/${ver}"
            rm -rf .tools/smoke
            mkdir -p .tools/smoke
            if ! curl -fsSL --retry 3 --connect-timeout 20 -o .tools/mihomo.gz \
                "${base}/mihomo-linux-amd64${flavor}-${ver}.gz"; then
              echo "  ⚠️ ${ver}${flavor} 下载失败"
              return 1
            fi
            gunzip -f .tools/mihomo.gz || { echo "  ⚠️ ${ver}${flavor} gzip 解压失败（文件损坏）"; return 1; }
            chmod +x .tools/mihomo
            if ! .tools/mihomo -v; then
              echo "  ⚠️ ${ver}${flavor} 无法执行（-v 失败）"
              return 1
            fi
            local port=$((RANDOM + 21000))
            printf 'mode: direct\nlog-level: warning\nexternal-controller: "127.0.0.1:%s"\nproxies:\n  - {name: probe, type: http, server: 127.0.0.1, port: 9}\n' "$port" \
              > .tools/smoke/config.yaml
            if ! .tools/mihomo -t -d .tools/smoke -f .tools/smoke/config.yaml; then
              echo "  ⚠️ ${ver}${flavor} 连最小配置都无法加载（-t 失败）"
              return 1
            fi
            .tools/mihomo -d .tools/smoke -f .tools/smoke/config.yaml \
              > .tools/smoke/mihomo.log 2>&1 &
            local pid=$! ok=0 i
            for i in $(seq 1 40); do
              if curl -fsS -o /dev/null "http://127.0.0.1:${port}/version" 2>/dev/null; then
                ok=1; break
              fi
              sleep 0.5
            done
            kill "${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            if [ "${ok}" != 1 ]; then
              echo "  ⚠️ ${ver}${flavor} 启动后 API 在 20s 内未就绪，内核日志尾部："
              tail -20 .tools/smoke/mihomo.log || true
              return 1
            fi
            echo "  ✅ ${ver}${flavor} 三级体检通过（可执行 / 配置可加载 / API 可就绪）"
          }

          # 回退链：latest 标准版 → latest compatible（老 CPU 指令集）→
          # 基准版 v1.19.31 标准 → v1.19.31 compatible（本地全库 e2e 验证过）
          versions=("${latest}")
          if [ "${latest}" != "v1.19.31" ]; then
            versions+=("v1.19.31")
          fi
          combos=()
          for v in "${versions[@]}"; do
            combos+=("${v}:" "${v}:-compatible")
          done

          ok=0
          for combo in "${combos[@]}"; do
            ver="${combo%%:*}"; flavor="${combo#*:}"
            echo "尝试 mihomo ${ver}${flavor} …"
            if fetch_kernel "${ver}" "${flavor}"; then
              ok=1
              echo "✅ 选定 mihomo 内核：${ver}${flavor}"
              break
            fi
            echo "  ⚠️ ${ver}${flavor} 不可用，回退下一组合"
          done
          if [ "${ok}" != 1 ]; then
            echo "❌ 所有内核组合（${combos[*]}）均不可用，放弃"
            exit 1
          fi

      - name: mihomo 预校验订阅配置（daily / merged / alive）
        id: clash-validation
        shell: bash
        run: |
          set -euo pipefail
          # 不校验上一轮的 alive：它可能正是需要被本轮刷新修复的旧产物。
          for file in sub/clash.yaml sub/merged/clash.yaml; do
            test -s "$file"
            echo "校验 $file"
            .tools/mihomo -t -d "$(dirname "$file")" -f "$file"
          done

      - name: 备份上一次存活订阅
        id: alive-backup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .alive-previous
          if [ -d sub/alive ]; then
            cp -a sub/alive .alive-previous
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ 已备份上一轮存活结果"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 尚无上一轮存活结果"
          fi

      - name: mihomo 实测活（TCP 预筛 + 精确 HTTPS 响应 + 出口 GeoIP）
        id: alive
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -s sub/geoip.metadb
          python scripts/mihomo_alive_check.py \
            --input sub/merged \
            --daily sub \
            --out sub/alive \
            --state sub/alive/state.json \
            --mihomo .tools/mihomo \
            --geoip-db sub/geoip.metadb \
            --scope "${{ inputs.alive_scope || 'full' }}" \
            --test-url "https://www.gstatic.com/generate_204" \
            --timeout 8 \
            --concurrency 128 \
            --retries 2

      - name: 校验新生成的存活订阅
        id: alive-validation
        if: steps.alive.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -s sub/alive/clash.yaml
          .tools/mihomo -t -d sub/alive -f sub/alive/clash.yaml

      - name: 新存活结果无效时恢复上一次结果
        if: always() && steps.clash-validation.outcome == 'success' && (steps.alive.outcome == 'failure' || steps.alive-validation.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sub/alive
          if [ -d .alive-previous ]; then
            cp -a .alive-previous sub/alive
            echo "⚠️ 新存活结果失败，已恢复上一轮结果"
          else
            mkdir -p sub/alive
            echo "⚠️ 新存活结果失败，且没有旧版本可恢复"
          fi

      - name: 统一策略组并校验国家分组覆盖率
        id: policy-normalization
        if: always() && steps.clash-validation.outcome == 'success'
        shell: bash
        env:
          COUNTRY_TTL_HOURS: ${{ vars.COUNTRY_TTL_HOURS }}
          COUNTRY_MIN_COVERAGE: ${{ vars.COUNTRY_MIN_COVERAGE }}
          COUNTRY_FAIL_LOW_COVERAGE: ${{ vars.COUNTRY_FAIL_LOW_COVERAGE }}
        run: |
          set -euo pipefail
          args=(--ttl-hours "${COUNTRY_TTL_HOURS:-24}" --min-coverage "${COUNTRY_MIN_COVERAGE:-0.8}")
          if [[ "${{ steps.alive.outcome }}" == "success" && "${{ steps.alive-validation.outcome }}" == "success" ]]; then
            args+=(--fresh-verification)
          fi
          if [[ "${COUNTRY_FAIL_LOW_COVERAGE:-false}" == "true" ]]; then
            args+=(--fail-low-coverage)
          fi
          python scripts/normalize_country_groups.py "${args[@]}"

      - name: 用 FlClash 内置核心验证配置导入与加载
        id: flclash-core-validation
        if: steps.policy-normalization.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          version="v0.8.98"
          asset="FlClash-0.8.98-linux-amd64.AppImage"
          work="$(mktemp -d "${RUNNER_TEMP}/flclash-core.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          base="https://github.com/chen08209/FlClash/releases/download/${version}"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 180 \
            "${base}/${asset}" -o "${work}/${asset}"
          curl -fsSL --retry 3 --connect-timeout 20 --max-time 60 \
            "${base}/SHA256SUMS" -o "${work}/SHA256SUMS"
          expected="$(awk -v name="./${asset}" '$2 == name {print $1}' "${work}/SHA256SUMS")"
          test -n "${expected}"
          printf '%s  %s\n' "${expected}" "${work}/${asset}" | sha256sum -c -
          chmod +x "${work}/${asset}"
          (cd "${work}" && "./${asset}" --appimage-extract >/dev/null)
          core="${work}/squashfs-root/FlClashCore"
          assets="${work}/squashfs-root/data/flutter_assets/assets/data"
          test -x "${core}"
          test -d "${assets}"
          configs=(sub/clash.yaml sub/merged/clash.yaml)
          if [ -s sub/alive/clash.yaml ]; then
            configs+=(sub/alive/clash.yaml)
            echo "FlClashCore 将实际加载 sub/alive/clash.yaml 并抽测最多 3 个存活节点"
            python scripts/flclash_core_check.py \
              --core "${core}" \
              --assets "${assets}" \
              --runtime-config sub/alive/clash.yaml \
              --test-url "https://www.gstatic.com/generate_204" \
              --timeout-ms 8000 \
              --delay-samples 3 \
              "${configs[@]}"
          else
            echo "⚠️ 没有 alive 配置：对 daily/merged 执行 FlClashCore 导入解析校验"
            python scripts/flclash_core_check.py \
              --core "${core}" \
              "${configs[@]}"
          fi

      - name: mihomo 最终校验统一策略配置
        id: policy-validation
        if: steps.policy-normalization.outcome == 'success'
        shell: bash
        env:
          ALIVE_OUTCOME: ${{ steps.alive.outcome }}
        run: |
          set -euo pipefail
          for file in sub/clash.yaml sub/merged/clash.yaml; do
            test -s "$file"
            echo "最终校验 $file"
            .tools/mihomo -t -d "$(dirname "$file")" -f "$file"
          done
          if [ -s sub/alive/clash.yaml ]; then
            echo "最终校验 sub/alive/clash.yaml"
            .tools/mihomo -t -d sub/alive -f sub/alive/clash.yaml
          elif [ "${ALIVE_OUTCOME}" = "success" ]; then
            echo "❌ alive 步骤成功却没有生成存活 Clash 文件"
            exit 1
          else
            echo "⚠️ 本轮无可用 alive 文件，稍后的测活门禁会使 Action 失败"
          fi

      - name: 提交变更（测活失败时也保住当天订阅更新，保留上一次 alive）
        id: commit
        if: always() && steps.clash-validation.outcome == 'success' && steps.policy-validation.outcome == 'success' && (steps.alive.outcome == 'success' || steps.alive.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.alive.outcome }}" != "success" ] || [ "${{ steps.alive-validation.outcome }}" != "success" ]; then
            echo "⚠️ 实测活或存活配置校验失败：本次提交当天订阅与合并结果，sub/alive 保留上一次的版本"
            EXTRA=" [alive-check/validation failed, kept previous alive]"
          else
            EXTRA=""
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only successful full validation closes this slot. Failed runs retry.
          if [ "${{ steps.alive.outcome }}" = "success" ] && \
             [ "${{ steps.alive-validation.outcome }}" = "success" ] && \
             [ "${{ steps.flclash-core-validation.outcome }}" = "success" ]; then
            python scripts/schedule_gate.py --mark "${{ needs.gate.outputs.slot }}"
          fi
          git add sub history
          if [ -f .schedule/success.json ]; then git add .schedule/success.json; fi
          if git diff --cached --quiet; then
            echo "本次合并后无变更，跳过提交"
            exit 0
          fi
          git commit -m "chore(sub): 去重合并 JCNode 订阅 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')${EXTRA}"
          git push || { git pull --rebase --autostash && git push; }

      - name: 刷新 jsDelivr daily / merged / alive 缓存
        if: steps.commit.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for file in sub/clash.yaml sub/merged/clash.yaml sub/alive/clash.yaml; do
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}/${file}"
            echo "刷新 ${url}"
            curl -fsSL --retry 2 --connect-timeout 15 "$url" || echo "⚠️ 缓存刷新失败（不影响已提交订阅）：$file"
            echo
          done

      - name: 上传订阅文件（可选，方便从 Actions 页直接下载）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jcnode-sub-daily-and-merged-${{ github.run_number }}
          path: sub/
          if-no-files-found: warn
          retention-days: 7

      - name: 测活门禁（测活未成功必须让 Action 变红，绝不静默保留旧存活文件）
        if: always() && steps.clash-validation.outcome == 'success' && (steps.alive.outcome != 'success' || steps.alive-validation.outcome != 'success')
        shell: bash
        run: |
          echo "❌ mihomo 实测活或新存活配置校验未成功（alive=${{ steps.alive.outcome }}, validation=${{ steps.alive-validation.outcome }}）"
          echo "本次已提交当天订阅与合并结果；sub/alive 已恢复上一轮文件（可能仍是旧结果）。"
          echo "请展开上方『mihomo 内核实测活』步骤日志，把 ❌ / ⚠️ 开头的行和内核诊断信息复制反馈，以便定位。"
          exit 1
