name: Update JCNode subscription

on:
  schedule:
    # 站点一般在北京时间 08:30-10:40 更新，这里 11:30 抓一次，18:00 再补一次
    # 注意：cron 用 UTC，北京时间 = UTC + 8
    - cron: "30 3 * * *"    # 11:30 CST
    - cron: "0 10 * * *"    # 18:00 CST
  workflow_dispatch:
    inputs:
      code:
        description: "已知口令（4 位数字），留空则自动枚举 AABB"
        required: false
        default: ""
      full_sweep:
        description: "AABB 失效时全量扫描 0000-9999（约 1 小时，慎用）"
        type: boolean
        default: false
      alive_scope:
        description: "mihomo 实测范围：full=全库（默认，约 10-30 分钟），daily=仅当日节点（快速）"
        type: choice
        options: [full, daily]
        default: full

permissions:
  contents: write

concurrency:
  group: jcnode-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装合并依赖
        run: python -m pip install --disable-pip-version-check --no-input PyYAML

      - name: 离线测试（不探测外部节点）
        run: python -m unittest discover -s tests -v

      - name: 定位抓取脚本
        id: locate-fetch
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/fetch_jcnode.py ]; then
            echo "path=scripts/fetch_jcnode.py" >> "$GITHUB_OUTPUT"
            echo "✅ 找到 scripts/fetch_jcnode.py"
          elif [ -f fetch_jcnode.py ]; then
            echo "path=fetch_jcnode.py" >> "$GITHUB_OUTPUT"
            echo "✅ 找到根目录 fetch_jcnode.py"
          else
            echo "❌ 仓库里没有 fetch_jcnode.py"
            exit 1
          fi

      - name: 定位合并脚本
        id: locate-merge
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/merge_subscriptions.py ]; then
            echo "path=scripts/merge_subscriptions.py" >> "$GITHUB_OUTPUT"
            echo "✅ 找到 scripts/merge_subscriptions.py"
          elif [ -f merge_subscriptions.py ]; then
            echo "path=merge_subscriptions.py" >> "$GITHUB_OUTPUT"
            echo "✅ 找到根目录 merge_subscriptions.py"
          else
            echo "❌ 仓库里没有 merge_subscriptions.py"
            exit 1
          fi

      - name: 抓取到临时目录（不碰旧订阅）
        env:
          INPUT_CODE: ${{ inputs.code }}
          INPUT_FULL: ${{ inputs.full_sweep }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .incoming-sub
          mkdir -p .incoming-sub
          # 让抓取脚本继续优先尝试上次口令；本次 meta 会在抓取后覆盖
          if [ -f sub/meta.json ]; then cp sub/meta.json .incoming-sub/meta.json; fi
          SCRIPT="${{ steps.locate-fetch.outputs.path }}"
          ARGS=""
          if [ -n "${INPUT_CODE:-}" ]; then ARGS="$ARGS --code ${INPUT_CODE}"; fi
          if [ "${INPUT_FULL:-false}" = "true" ]; then ARGS="$ARGS --mode full"; fi
          echo "运行: python $SCRIPT --out-dir .incoming-sub ${ARGS:-（默认 AABB 枚举）}"
          python "$SCRIPT" --out-dir .incoming-sub --history .incoming-sub/codes.log $ARGS

      - name: 保存当天订阅（覆盖 daily，保留综合版）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sub
          for file in clash.yaml singbox.json v2ray.txt meta.json; do
            test -s ".incoming-sub/$file"
            cp ".incoming-sub/$file" "sub/$file.tmp"
            mv "sub/$file.tmp" "sub/$file"
          done
          echo "✅ 当天订阅已更新到 sub/ 根目录"

      - name: 合并到综合订阅（当日结构模板，全库按 MB/s 排序）
        shell: bash
        run: |
          set -euo pipefail
          MERGER="${{ steps.locate-merge.outputs.path }}"
          python "$MERGER" \
            --base sub/merged \
            --out sub/merged \
            --incoming .incoming-sub \
            --history history/codes.log
          rm -rf .incoming-sub

      - name: 下载 mihomo 内核（多版本回退 + 下载即体检，临时机每次全新下载）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools

          # 通过 releases/latest 的 302 重定向解析最新版本号（不消耗 API 配额）
          latest="$(curl -fsSL -o /dev/null -w '%{url_effective}' \
            https://github.com/MetaCubeX/mihomo/releases/latest \
            | sed -n 's#.*/tag/##p' | tr -d '[:space:]')"
          if [ -z "${latest}" ] || [ "${latest}" = "latest" ]; then
            echo "⚠️ 未能解析最新版本号，回退固定版本 v1.19.31"
            latest="v1.19.31"
          fi
          echo "mihomo 最新版本：${latest}（本地全库验证过的基准版：v1.19.31）"

          # 下载一个候选内核并做三级体检：1) -v 可执行 2) -t 最小配置可加载
          # 3) 真实启动后 API 能就绪。任一不过即返回失败，由外层尝试下一组合。
          fetch_kernel() {
            local ver="$1" flavor="$2"
            local base="https://github.com/MetaCubeX/mihomo/releases/download/${ver}"
            rm -rf .tools/smoke
            mkdir -p .tools/smoke
            if ! curl -fsSL --retry 3 --connect-timeout 20 -o .tools/mihomo.gz \
                "${base}/mihomo-linux-amd64${flavor}-${ver}.gz"; then
              echo "  ⚠️ ${ver}${flavor} 下载失败"
              return 1
            fi
            gunzip -f .tools/mihomo.gz || { echo "  ⚠️ ${ver}${flavor} gzip 解压失败（文件损坏）"; return 1; }
            chmod +x .tools/mihomo
            if ! .tools/mihomo -v; then
              echo "  ⚠️ ${ver}${flavor} 无法执行（-v 失败）"
              return 1
            fi
            local port=$((RANDOM + 21000))
            printf 'mode: direct\nlog-level: warning\nexternal-controller: "127.0.0.1:%s"\nproxies:\n  - {name: probe, type: http, server: 127.0.0.1, port: 9}\n' "$port" \
              > .tools/smoke/config.yaml
            if ! .tools/mihomo -t -d .tools/smoke -f .tools/smoke/config.yaml; then
              echo "  ⚠️ ${ver}${flavor} 连最小配置都无法加载（-t 失败）"
              return 1
            fi
            .tools/mihomo -d .tools/smoke -f .tools/smoke/config.yaml \
              > .tools/smoke/mihomo.log 2>&1 &
            local pid=$! ok=0 i
            for i in $(seq 1 40); do
              if curl -fsS -o /dev/null "http://127.0.0.1:${port}/version" 2>/dev/null; then
                ok=1; break
              fi
              sleep 0.5
            done
            kill "${pid}" 2>/dev/null || true
            wait "${pid}" 2>/dev/null || true
            if [ "${ok}" != 1 ]; then
              echo "  ⚠️ ${ver}${flavor} 启动后 API 在 20s 内未就绪，内核日志尾部："
              tail -20 .tools/smoke/mihomo.log || true
              return 1
            fi
            echo "  ✅ ${ver}${flavor} 三级体检通过（可执行 / 配置可加载 / API 可就绪）"
          }

          # 回退链：latest 标准版 → latest compatible（老 CPU 指令集）→
          # 基准版 v1.19.31 标准 → v1.19.31 compatible（本地全库 e2e 验证过）
          versions=("${latest}")
          if [ "${latest}" != "v1.19.31" ]; then
            versions+=("v1.19.31")
          fi
          combos=()
          for v in "${versions[@]}"; do
            combos+=("${v}:" "${v}:-compatible")
          done

          ok=0
          for combo in "${combos[@]}"; do
            ver="${combo%%:*}"; flavor="${combo#*:}"
            echo "尝试 mihomo ${ver}${flavor} …"
            if fetch_kernel "${ver}" "${flavor}"; then
              ok=1
              echo "✅ 选定 mihomo 内核：${ver}${flavor}"
              break
            fi
            echo "  ⚠️ ${ver}${flavor} 不可用，回退下一组合"
          done
          if [ "${ok}" != 1 ]; then
            echo "❌ 所有内核组合（${combos[*]}）均不可用，放弃"
            exit 1
          fi

      - name: mihomo 内核实测活（TCP 预筛 + 真实代理延迟测试，聚合能连上的）
        id: alive
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mihomo_alive_check.py \
            --input sub/merged \
            --daily sub \
            --out sub/alive \
            --state sub/alive/state.json \
            --mihomo .tools/mihomo \
            --scope "${{ inputs.alive_scope || 'full' }}" \
            --test-url "http://www.gstatic.com/generate_204" \
            --timeout 5 \
            --concurrency 128 \
            --retries 1

      - name: 提交变更（测活失败时也保住当天订阅更新，保留上一次 alive）
        if: always() && (steps.alive.outcome == 'success' || steps.alive.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.alive.outcome }}" = "failure" ]; then
            echo "⚠️ mihomo 实测活步骤失败：本次仅提交当天订阅与合并结果，sub/alive 保留上一次的版本"
            EXTRA=" [alive-check failed, kept previous alive]"
          else
            EXTRA=""
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub history
          if git diff --cached --quiet; then
            echo "本次合并后无变更，跳过提交"
            exit 0
          fi
          git commit -m "chore(sub): 去重合并 JCNode 订阅 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')${EXTRA}"
          git push || { git pull --rebase --autostash && git push; }

      - name: 上传订阅文件（可选，方便从 Actions 页直接下载）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jcnode-sub-daily-and-merged-${{ github.run_number }}
          path: sub/
          if-no-files-found: warn
          retention-days: 7
