name: Auto-Node-Pipeline

on:
  schedule:
    - cron: '30 3 * * *'  # 11:30 Asia/Shanghai
    - cron: '0 10 * * *'  # 18:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      dry_run:
        description: '真实测活并校验，但不更新订阅（首次运行推荐）'
        type: boolean
        default: true
      limit:
        description: '最多测试多少节点；0=全量，其他值将标记为部分测试'
        type: number
        default: 0

permissions:
  contents: read
concurrency:
  group: auto-node-pipeline-${{ github.repository }}
  cancel-in-progress: false

jobs:
  pipeline:
    # Forks/schedules require an explicit opt-in; manual runs also stay on the default branch.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.PIPELINE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Install SHA256-pinned core and GeoIP database
        run: python scripts/install_tools.py
      - name: Run staged pipeline
        env:
          JCNODE_CODE: ${{ secrets.JCNODE_CODE }}
          # Add other source URL Secrets here when using source.url_env.
          ALLOW_PUBLIC_PUBLISH: ${{ vars.ALLOW_PUBLIC_PUBLISH }}
          DRY_RUN: ${{ inputs.dry_run }}
          NODE_LIMIT: ${{ inputs.limit }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${DRY_RUN:-false}" == true ]]; then args+=(--dry-run); fi
          if [[ -n "${NODE_LIMIT:-}" && "${NODE_LIMIT}" != 0 ]]; then
            [[ "${NODE_LIMIT}" =~ ^[0-9]+$ ]] || { echo 'Invalid node limit'; exit 1; }
            args+=(--limit "$NODE_LIMIT")
          fi
          python scripts/pipeline.py "${args[@]}"
      - name: Publish one consistent Git snapshot
        if: success() && inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily full alive sub reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(nodes): validated snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # Never force push/rebase stale generated data over a newer pipeline result.
          git push
      - name: Upload sanitized run report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-report-${{ github.run_number }}
          path: |
            .runtime/report.json
            .runtime/report.md
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
